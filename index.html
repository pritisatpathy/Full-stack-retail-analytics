<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        CartNest | Checkout
    </title>

    <link
        rel="stylesheet"
        href="/checkout.css"
    >

</head>


<body>


<div class="topbar">

    <span>C</span>

    CartNest

</div>


<div class="page">

    <button
        class="back-button"
        onclick="window.location.href='/'"
    >
        ← BACK TO STORE
    </button>


    <div class="checkout-grid">


        <!-- DELIVERY DETAILS -->

        <div class="card">

            <h2>
                Delivery Details
            </h2>


            <div class="row">


                <div class="field">

                    <label>
                        First Name *
                    </label>

                    <input
                        id="fname"
                        maxlength="30"
                        autocomplete="given-name"
                        placeholder="First name"
                    >

                    <span
                        class="error"
                        id="fnameError"
                    ></span>

                </div>


                <div class="field">

                    <label>
                        Last Name *
                    </label>

                    <input
                        id="lname"
                        maxlength="30"
                        autocomplete="family-name"
                        placeholder="Last name"
                    >

                    <span
                        class="error"
                        id="lnameError"
                    ></span>

                </div>


            </div>


            <div class="field">

                <label>
                    Mobile Number *
                </label>

                <input
                    id="phone"
                    type="tel"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    placeholder="10-digit mobile number"
                >

                <span
                    class="error"
                    id="phoneError"
                ></span>

            </div>


            <div class="field">

                <label>
                    Email
                    <span class="optional">
                        (optional)
                    </span>
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="example@email.com"
                >

                <span
                    class="error"
                    id="emailError"
                ></span>

            </div>


            <div class="field">

                <label>
                    Address *
                </label>

                <input
                    id="address"
                    maxlength="150"
                    autocomplete="street-address"
                    placeholder="House no., street, area"
                >

                <span
                    class="error"
                    id="addressError"
                ></span>

            </div>


            <div class="field">

                <label>
                    Address Line 2 / Landmark
                    <span class="optional">
                        (optional)
                    </span>
                </label>

                <input
                    id="address2"
                    maxlength="100"
                    placeholder="Apartment, landmark, etc."
                >

            </div>


            <div class="row">


                <div class="field">

                    <label>
                        PIN Code *
                    </label>

                    <input
                        id="zip"
                        type="tel"
                        maxlength="6"
                        inputmode="numeric"
                        autocomplete="postal-code"
                        placeholder="6-digit PIN"
                    >

                    <span
                        class="error"
                        id="zipError"
                    ></span>

                    <span class="hint">
                        Enter 6 digits to automatically find your city and state.
                    </span>

                </div>


                <div class="field">

                    <label>
                        City *
                    </label>

                    <input
                        id="city"
                        class="readonly"
                        readonly
                        placeholder="Auto-filled"
                    >

                    <span
                        class="error"
                        id="cityError"
                    ></span>

                </div>


            </div>


            <div class="row">


                <div class="field">

                    <label>
                        State *
                    </label>

                    <input
                        id="state"
                        class="readonly"
                        readonly
                        placeholder="Auto-filled"
                    >

                    <span
                        class="error"
                        id="stateError"
                    ></span>

                </div>


                <div class="field">

                    <label>
                        Shipping *
                    </label>

                    <select id="ship_mode">

                        <option value="">
                            Select shipping
                        </option>

                        <option value="Standard">
                            Standard Delivery
                        </option>

                        <option value="Express">
                            Express Delivery
                        </option>

                    </select>

                    <span
                        class="error"
                        id="ship_modeError"
                    ></span>

                </div>


            </div>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="card">

            <h2>
                Order Summary
            </h2>


            <div
                id="checkoutItems"
            ></div>


            <div class="summary-line">

                <span>
                    Subtotal
                </span>

                <span id="subtotal">
                    $0.00
                </span>

            </div>


            <div class="total">

                <span>
                    Total
                </span>

                <span id="total">
                    $0.00
                </span>

            </div>


            <button
                class="place-order"
                id="placeOrderButton"
                onclick="submitOrder()"
            >
                PLACE ORDER
            </button>

        </div>


    </div>

</div>


<!-- SUCCESS -->

<div
    class="success"
    id="successModal"
>

    <div class="success-box">

        <div class="success-icon">
            ✅
        </div>

        <h2>
            Order Placed!
        </h2>

        <p>
            Your order has been placed successfully.
        </p>

        <button
            class="place-order"
            onclick="window.location.href='/'"
        >
            CONTINUE SHOPPING
        </button>

    </div>

</div>


<script>


/* =========================
   CART
========================= */

let cart =
    JSON.parse(
        localStorage.getItem("cart")
    ) || [];


const $ = id =>
    document.getElementById(id);


/* =========================
   VALIDATION
========================= */

function nameOK(value) {

    return (
        /^[A-Za-z]+(?:[ '’-][A-Za-z]+)*$/
            .test(value)
        &&
        value.length >= 2
    );

}


function phoneOK(value) {

    return /^\d{10}$/.test(value);

}


function pinOK(value) {

    return /^\d{6}$/.test(value);

}


function emailOK(value) {

    return (
        !value ||
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(value)
    );

}


function mark(
    id,
    message
) {

    const field =
        $(id);

    const error =
        $(id + "Error");


    field.classList.toggle(
        "invalid",
        !!message
    );


    field.classList.toggle(
        "valid",
        !message &&
        field.value.trim() !== ""
    );


    if (error) {

        error.innerText =
            message || "";

    }

}


/* =========================
   FORM VALIDATION
========================= */

function validateForm() {

    let valid = true;


    const fname =
        $("fname")
            .value
            .trim();


    const lname =
        $("lname")
            .value
            .trim();


    const phone =
        $("phone")
            .value
            .trim();


    const email =
        $("email")
            .value
            .trim();


    const address =
        $("address")
            .value
            .trim();


    const pin =
        $("zip")
            .value
            .trim();


    /* FIRST NAME */

    if (!nameOK(fname)) {

        mark(
            "fname",
            "Enter a valid first name."
        );

        valid = false;

    } else {

        mark(
            "fname",
            ""
        );

    }


    /* LAST NAME */

    if (!nameOK(lname)) {

        mark(
            "lname",
            "Enter a valid last name."
        );

        valid = false;

    } else {

        mark(
            "lname",
            ""
        );

    }


    /* PHONE */

    if (!phoneOK(phone)) {

        mark(
            "phone",
            "Phone number must contain exactly 10 digits."
        );

        valid = false;

    } else {

        mark(
            "phone",
            ""
        );

    }


    /* EMAIL */

    if (!emailOK(email)) {

        mark(
            "email",
            "Enter a valid email address."
        );

        valid = false;

    } else {

        mark(
            "email",
            ""
        );

    }


    /* ADDRESS */

    if (address.length < 5) {

        mark(
            "address",
            "Address is required."
        );

        valid = false;

    } else {

        mark(
            "address",
            ""
        );

    }


    /* PIN */

    if (!pinOK(pin)) {

        mark(
            "zip",
            "PIN must contain exactly 6 digits."
        );

        valid = false;

    } else {

        mark(
            "zip",
            ""
        );

    }


    /* CITY */

    if (!$("city").value.trim()) {

        $("cityError").innerText =
            "Enter a valid PIN to find your city.";

        valid = false;

    } else {

        $("cityError").innerText = "";

    }


    /* STATE */

    if (!$("state").value.trim()) {

        $("stateError").innerText =
            "Enter a valid PIN to find your state.";

        valid = false;

    } else {

        $("stateError").innerText = "";

    }


    /* SHIPPING */

    if (!$("ship_mode").value) {

        $("ship_modeError").innerText =
            "Please select a shipping method.";

        valid = false;

    } else {

        $("ship_modeError").innerText = "";

    }


    return valid;

}


/* =========================
   PIN LOOKUP
========================= */

async function lookupPincode() {

    const pin =
        $("zip")
            .value
            .replace(/\D/g, "")
            .slice(0, 6);


    $("zip").value =
        pin;


    $("city").value =
        "";

    $("state").value =
        "";


    $("cityError").innerText =
        "";

    $("stateError").innerText =
        "";


    if (pin.length !== 6) {

        if (pin.length > 0) {

            mark(
                "zip",
                "PIN must contain exactly 6 digits."
            );

        }

        return;

    }


    $("zipError").innerText =
        "Checking PIN…";


    try {

        const response =
            await fetch(
                "https://api.postalpincode.in/pincode/" +
                pin
            );


        const data =
            await response.json();


        if (
            data &&
            data[0] &&
            data[0].Status === "Success" &&
            data[0].PostOffice &&
            data[0].PostOffice.length
        ) {

            const postOffice =
                data[0].PostOffice[0];


            $("city").value =
                postOffice.District ||
                postOffice.Name ||
                "";


            $("state").value =
                postOffice.State ||
                "";


            $("zipError").innerText =
                "✓ PIN verified";


            $("zip").classList.remove(
                "invalid"
            );

            $("zip").classList.add(
                "valid"
            );


            $("city").classList.add(
                "valid"
            );

            $("state").classList.add(
                "valid"
            );


        } else {

            mark(
                "zip",
                "Invalid PIN code. Please check the 6 digits."
            );

        }

    } catch (error) {

        console.error(error);

        mark(
            "zip",
            "Could not verify this PIN right now. Please try again."
        );

    }

}


/* =========================
   INPUT EVENTS
========================= */

$("zip").addEventListener(
    "input",
    lookupPincode
);


$("phone").addEventListener(
    "input",
    function() {

        this.value =
            this.value
                .replace(/\D/g, "")
                .slice(0, 10);

        validateForm();

    }
);


[
    "fname",
    "lname",
    "email",
    "address"
].forEach(id => {

    $(id).addEventListener(
        "input",
        validateForm
    );

});


$("ship_mode").addEventListener(
    "change",
    validateForm
);


/* =========================
   CHECKOUT ITEMS
========================= */

function renderCheckout() {

    const container =
        $("checkoutItems");


    if (cart.length === 0) {

        container.innerHTML = `

            <div class="empty">

                <div>
                    🛒
                </div>

                <h3>
                    Your cart is empty
                </h3>

                <p>
                    Add products before checking out.
                </p>

            </div>

        `;


        $("placeOrderButton")
            .disabled = true;


        return;

    }


    let subtotal = 0;


    container.innerHTML =
        cart.map(item => {

            const itemTotal =
                item.price *
                item.quantity;


            subtotal +=
                itemTotal;


            return `

                <div class="cart-item">

                    <img
                        src="${item.image}"
                        alt="${item.name}"
                        onerror="
                            this.src='https://placehold.co/500x400/e8e8e8/333333?text=Product';
                        "
                    >


                    <div class="item-info">

                        <div class="item-name">
                            ${item.name}
                        </div>

                        <div class="item-details">
                            Qty:
                            ${item.quantity}
                            ×
                            $${item.price.toFixed(2)}
                        </div>

                        <strong>
                            $${itemTotal.toFixed(2)}
                        </strong>

                    </div>

                </div>

            `;

        })
        .join("");


    $("subtotal").innerText =
        "$" + subtotal.toFixed(2);


    $("total").innerText =
        "$" + subtotal.toFixed(2);

}


/* =========================
   PLACE ORDER
========================= */

async function submitOrder() {

    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;

    }


    if (!validateForm()) {

        alert(
            "Please correct the highlighted fields before placing your order."
        );

        return;

    }


    const button =
        $("placeOrderButton");


    button.disabled =
        true;


    button.innerText =
        "PLACING ORDER…";


    const customerName =
        (
            $("fname").value.trim() +
            " " +
            $("lname").value.trim()
        );


    try {

        /* =========================================
           GET / CREATE CUSTOMER
        ========================================= */

        const customerResponse =
            await fetch(
                "/api/login",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        customer_name:
                            customerName,

                        phone:
                            $("phone")
                                .value
                                .trim(),

                        email:
                            $("email")
                                .value
                                .trim(),

                        dob:
                            null

                    })

                }
            );


        if (!customerResponse.ok) {

            let data = {};

            try {

                data =
                    await customerResponse.json();

            } catch (error) {}


            throw new Error(
                data.detail ||
                "Could not create/find customer."
            );

        }


        const customerData =
            await customerResponse.json();


        /*
            The backend returns the
            customer ID here.
        */

        const customerId =
            customerData.customer_id;


        if (!customerId) {

            throw new Error(
                "Customer ID was not returned by the server."
            );

        }


        /*
            Save the customer ID so it can
            be reused later.
        */

        localStorage.setItem(
            "customer_id",
            customerId
        );


        /* =========================================
           PLACE ORDER FOR EACH CART ITEM
        ========================================= */

        for (
            const item of cart
        ) {

            const sales =
                parseFloat(
                    (
                        item.price *
                        item.quantity
                    ).toFixed(2)
                );


            const payload = {

                customer_id:
                    customerId,

                customer_name:
                    customerName,

                phone:
                    $("phone")
                        .value
                        .trim(),

                ship_mode:
                    $("ship_mode")
                        .value,

                product_id:
                    item.id,

                product_name:
                    item.name,

                quantity:
                    item.quantity,

                sales:
                    sales

            };


            const response =
                await fetch(
                    "/api/buy",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );


            if (!response.ok) {

                let data = {};

                try {

                    data =
                        await response.json();

                } catch (error) {}


                throw new Error(
                    data.detail ||
                    "Order failed."
                );

            }

        }


        /* =========================================
           SUCCESS
        ========================================= */

        /*
            Clear cart only after every
            item has been successfully
            inserted into the database.
        */

        localStorage.removeItem(
            "cart"
        );


        $("successModal")
            .style.display =
            "flex";


    } catch (error) {

        console.error(
            "ORDER ERROR:",
            error
        );


        alert(
            "There was a problem placing your order: " +
            error.message
        );


        button.disabled =
            false;


        button.innerText =
            "PLACE ORDER";

    }

}


/* =========================
   PREFILL LOGIN DATA
========================= */

const savedName =
    localStorage.getItem(
        "customer_name"
    );


const savedPhone =
    localStorage.getItem(
        "customer_phone"
    );


if (savedName) {

    const parts =
        savedName
            .trim()
            .split(/\s+/);


    $("fname").value =
        parts.shift() || "";


    $("lname").value =
        parts.join(" ");

}


if (savedPhone) {

    $("phone").value =
        savedPhone;

}


/* =========================
   START
========================= */

renderCheckout();

validateForm();


</script>

</body>

</html>
